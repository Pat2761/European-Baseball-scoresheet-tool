<body lang="en-US" link="#0563c1" vlink="#800000" dir="ltr"><h2 lang="fr-FR" class="western">
<span lang="en-US">Particular advances</span></h2>
<p lang="fr-FR" style="margin-bottom: 0.35cm"><a name="_GoBack"></a><span lang="en-US">There
are specific situations of play, largely concerning batters, in which
the umpire, in application of the provisions of rules
5.06(c)(7),5.06(c)(8), 5.09(a)(14) and 5.06(b)(3)(C) of the OBR,
calls “dead ball” and advances all runners to the next bases.</span></p>
