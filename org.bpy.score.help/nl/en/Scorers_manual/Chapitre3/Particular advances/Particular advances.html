	<h2 class="title2">Particular advances.</h2>
	
	<p class="normalText">There are specific situations of play, largely concerning batters, in which the umpire, in application of 
	the provisions of rules 5.06(c)(7),5.06(c)(8), 5.09(a)(14) and 5.06(b)(3)(C) of the OBR, calls “dead ball” and advances all 
	runners to the next bases.
	</p>
