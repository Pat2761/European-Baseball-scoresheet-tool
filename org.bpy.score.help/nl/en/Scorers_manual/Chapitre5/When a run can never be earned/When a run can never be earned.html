	<h2 class="title2">When a run can never be earned.</h2>
	
	<p class="normalText">Apart from the case we have already seen of runs scored after the three fielding chances, a 
	run can never be earned if the presence on the bases of the runner who scored the run was prolonged by one of the 
	fielding chances listed above.</p>
