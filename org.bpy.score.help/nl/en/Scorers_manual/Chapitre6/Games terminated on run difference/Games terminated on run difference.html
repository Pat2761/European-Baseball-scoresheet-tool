	<h2 class="title2">Games terminated on run difference</h2>
	
	<p class="normalText">A game may be terminated because of a run difference in the results of the two teams.</p>
	
	<p class="normalText">In the event that a match terminated under the above conditions is in any case a regulation 
	game, all considerations in terms of winning runs and the value of safe hits apply.</p>
